# Resolve findings -- the one shared workflow every repo uses to fix its code
# scanning results automatically. Each repo keeps a tiny caller
# (.github/workflows/resolve-findings.yml) that runs this after its CodeQL scan
# finishes. Change the behaviour here, once, and every repo picks it up.
#
# What it does, in plain terms: after a push is scanned, it gathers the open
# findings from BOTH CodeQL (already in GitHub) and Sonar (read straight from
# Sonar's API), and if there are any, it asks Claude to fix them, run the tests,
# and open one pull request for a person to review. It never merges on its own and
# never pushes to the main branch.
#
# Auth: the org secret CLAUDE_CODE_OAUTH_TOKEN (a Claude subscription token). The
# Sonar token (SONAR_TOKEN) is optional -- if a repo doesn't have one, Sonar is
# skipped and only CodeQL findings are handled. Both are passed in by the caller
# with `secrets: inherit`.

name: Resolve Findings (reusable)

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "Claude subscription token (org secret, passed via secrets: inherit)."
        required: true
      SONAR_TOKEN:
        description: "Sonar token, optional. If missing, Sonar findings are skipped."
        required: false

permissions:
  contents: write
  pull-requests: write
  security-events: read   # read this repo's open CodeQL alerts
  id-token: write         # claude-code-action fetches a token at startup

concurrency:
  group: resolve-findings
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Gather open findings from CodeQL and Sonar
        id: gather
        env:
          GH_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # Collect every open finding into one plain list, kept in the runner's
          # temp area so it can never end up in the pull request. Each line reads:
          #   - [severity] source:rule — file:line — description
          out="${RUNNER_TEMP}/findings.txt"
          : > "$out"

          # 1) CodeQL (and anything else already in GitHub code scanning).
          gh api "repos/${{ github.repository }}/code-scanning/alerts?state=open&per_page=100" \
            --jq '.[] | "- [\(.rule.security_severity_level // "note")] \(.tool.name):\(.rule.id) — \(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line) — \(.rule.description)"' \
            >> "$out" 2>/dev/null || true

          # 2) Sonar, read straight from its API (no need to copy it into GitHub
          #    first). Skipped when there is no Sonar token. The project key comes
          #    from sonar-project.properties if present, otherwise the standard
          #    "rockpa_<repo>" name; the organization is always "rockpa".
          if [ -n "${SONAR_TOKEN:-}" ]; then
            key="rockpa_$(basename "${{ github.repository }}")"
            if [ -f sonar-project.properties ]; then
              k=$(grep -m1 '^sonar.projectKey=' sonar-project.properties | cut -d= -f2 | tr -d '[:space:]')
              [ -n "$k" ] && key="$k"
            fi
            curl -s -u "${SONAR_TOKEN}:" \
              "https://sonarcloud.io/api/issues/search?componentKeys=${key}&organization=rockpa&resolved=false&ps=200" \
              | jq -r '.issues[]? | "- [\(.severity)] Sonar:\(.rule) — \(.component | sub(".*:";"")):\(.line // 1) — \(.message)"' \
              >> "$out" 2>/dev/null || true
          fi

          # Count the findings. `grep -c` prints 0 and exits non-zero when nothing
          # matches, so allow that exit (|| true) and keep just its single "0"
          # line -- adding our own would write a second line and break the step
          # output. Fall back to 0 only if grep produced nothing at all.
          count=$(grep -c '^- ' "$out" 2>/dev/null) || true
          [ -n "$count" ] || count=0
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count open finding(s):"
          cat "$out" || true

      - name: Fix the findings with Claude
        if: steps.gather.outputs.count != '0'
        uses: anthropics/claude-code-action@787c5a0ce96a9a6cfb050ea0c8f4c05f2447c251  # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --permission-mode acceptEdits
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash"
            --max-turns 120
            --model claude-sonnet-5
          prompt: |
            This repository has open code scanning findings. They are listed in the
            file ${{ runner.temp }}/findings.txt, one per line, in this shape:
              - [severity] source:rule — file:line — description

            Fix as many as you safely can, and leave the rest alone.

            For each finding:
              * Open the file at the line given and understand the real cause.
              * Make the smallest change that fixes it without changing behaviour.
                Keep the existing comments; add a short one explaining why only
                where the fix is not obvious.
              * If a finding is a false alarm or needs a human judgement call (for
                example a security warning about something that is intentional, or a
                protocol requirement), do NOT change the code. Note it, with your
                reasoning, so it can go in the pull request description.

            If this repository has a tests folder, run the tests with
            "python -m pytest tests/ -q" after your changes. If a test fails,
            undo the change that broke it. Keep only the fixes that pass. Never
            weaken, skip, or delete a test to make it pass.

            Never touch secrets, credentials, local.settings.json, .env, lockfiles,
            workflow files, or generated files. Only edit the source a finding
            points at. The findings file lives in the runner temp folder, not the
            repository -- do not copy it into the working tree.

            Writing style: use plain English in every comment and in the pull
            request description. Say things simply, no jargon.

      - name: Open a pull request with the fixes
        if: steps.gather.outputs.count != '0'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676  # v7
        with:
          branch: auto-fix/code-scanning
          title: "Fix code scanning findings"
          commit-message: "fix: resolve open code scanning findings"
          body: |
            Claude looked at this repository's open CodeQL and Sonar findings and
            fixed the ones it safely could. Please review before merging.

            Anything left for a person to decide (false alarms, security calls,
            protocol requirements) is explained in the workflow run log rather than
            changed in code. If this pull request looks wrong, just close it -- the
            next run opens a fresh one.
          labels: |
            automated
            code-scanning
          delete-branch: true
